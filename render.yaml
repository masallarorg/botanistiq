services:
  - type: web
    name: botanistiq-api
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: BOTANISTIQ_OPENAI_MODEL
        value: gpt-4o-mini
      - key: BOTANISTIQ_ALLOWED_ORIGINS
        value: "*"
